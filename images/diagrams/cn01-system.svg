<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The model is one component. The system is the product."><defs><marker id="cn01-system-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1916"/></marker><marker id="cn01-system-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1A1A"/></marker><marker id="cn01-system-ah-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><rect x="80" y="46" width="40" height="2" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="80" y="80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#b83020" text-anchor="start" font-weight="500" letter-spacing="3">CRAFT NOTES · 01 · ARCHITECTURE</text><text x="80" y="130" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#1a1916" text-anchor="start" font-weight="400">The model is one component. The system is the product.</text><text x="80" y="166" font-family="'Literata', Georgia, serif" font-size="18" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">Contracts before the model. Verification and a human after it. A record under all of it.</text><rect x="60" y="205" width="1080" height="400" rx="6" fill="none" stroke="rgba(26,25,22,0.28)" stroke-width="1" stroke-dasharray="6 5"/><text x="86" y="240" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#8B1A1A" text-anchor="start" font-weight="500" letter-spacing="2">THE PRODUCT: WHAT BUYERS PAY FOR</text><rect x="86" y="300" width="180" height="150" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="104" y="330" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">01</text><text x="104" y="370" font-family="'DM Serif Display', Georgia, serif" font-size="24" fill="#1a1916" text-anchor="start" font-weight="400">Input</text><text x="104" y="402" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">requirement +</text><text x="104" y="420" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">verified context</text><rect x="298" y="300" width="180" height="150" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="316" y="330" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">02</text><text x="316" y="370" font-family="'DM Serif Display', Georgia, serif" font-size="24" fill="#1a1916" text-anchor="start" font-weight="400">Contract</text><text x="316" y="402" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">shape · count</text><text x="316" y="420" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">naming · evidence</text><rect x="510" y="330" width="180" height="90" rx="4" fill="#0c0b09" stroke="none" stroke-width="1"/><text x="528" y="352" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">03</text><text x="582" y="360" font-family="'DM Serif Display', Georgia, serif" font-size="24" fill="#f5f0e8" text-anchor="start" font-weight="400">LLM</text><text x="528" y="384" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8b6b0" text-anchor="start" font-weight="400">replaceable,</text><text x="528" y="400" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8b6b0" text-anchor="start" font-weight="400">routed by preset</text><text x="600" y="316" font-family="'Literata', Georgia, serif" font-size="15" fill="#8a8880" text-anchor="middle" font-weight="400" font-style="italic">the part everyone demos</text><rect x="722" y="300" width="180" height="150" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="740" y="330" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">04</text><text x="740" y="370" font-family="'DM Serif Display', Georgia, serif" font-size="24" fill="#1a1916" text-anchor="start" font-weight="400">Verify</text><text x="740" y="402" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">contract + evidence</text><text x="740" y="420" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">checks · labelled</text><rect x="934" y="300" width="180" height="150" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><rect x="934" y="300" width="180" height="4" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="952" y="330" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">05</text><text x="952" y="370" font-family="'DM Serif Display', Georgia, serif" font-size="24" fill="#1a1916" text-anchor="start" font-weight="400">Human gate</text><text x="952" y="402" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">a person