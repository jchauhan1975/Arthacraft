<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-label="Five things to measure on every output."><defs><marker id="cn02-measure-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1916"/></marker><marker id="cn02-measure-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1A1A"/></marker><marker id="cn02-measure-ah-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0" y="0" width="1200" height="730" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><rect x="80" y="46" width="40" height="2" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="80" y="80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#b83020" text-anchor="start" font-weight="500" letter-spacing="3">CRAFT NOTES · 02 · EVALUATION</text><text x="80" y="130" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#1a1916" text-anchor="start" font-weight="400">Five things to measure on every output.</text><text x="80" y="166" font-family="'Literata', Georgia, serif" font-size="18" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">Score against the contract, not on impression.</text><text x="130" y="226" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2">DIMENSION</text><text x="420" y="226" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2">THE QUESTION</text><text x="880" y="226" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2">HOW YOU CHECK IT</text><line x1="80" y1="240" x2="1120" y2="240" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="80" y="287" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#8B1A1A" text-anchor="start" font-weight="500">01</text><text x="130" y="285" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Contract</text><text x="420" y="284" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Right shape, item count and names?</text><rect x="880" y="262" width="240" height="30" rx="15" fill="#1a1916" stroke="none" stroke-width="1"/><text x="1000" y="281" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#f5f0e8" text-anchor="middle" font-weight="400" letter-spacing="1">SCHEMA VALIDATOR</text><line x1="80" y1="312" x2="1120" y2="312" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="80" y="359" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#8B1A1A" text-anchor="start" font-weight="500">02</text><text x="130" y="357" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Grounding</text><text x="420" y="356" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Is every claim backed by evidence it cites?</text><rect x="880" y="334" width="240" height="30" rx="15" fill="none" stroke="#1a1916" stroke-width="1"/><text x="1000" y="353" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1a1916" text-anchor="middle" font-weight="400" letter-spacing="1">EVIDENCE CHECK + SAMPLE</text><line x1="80" y1="384" x2="1120" y2="384" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="80" y="431" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#8B1A1A" text-anchor="start" font-weight="500">03</text><text x="130" y="429" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Consistency</text><text x="420" y="428" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Same input, same decision, run after run?</text><rect x="880" y="406" width="240" height="30" rx="15" fill="none" stroke="#1a1916" stroke-width="1"/><text x="1000" y="425" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1a1916" text-anchor="middle" font-weight="400" letter-spacing="1">REPEAT RUNS · AGREEMENT</text><line x1="80" y1="456" x2="1120" y2="456" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="80" y="503" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#8B1A1A" text-anchor="start" font-weight="500">04</text><text x="130" y="501" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Calibration</text><text x="420" y="500" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Does stated confidence match accuracy?</text><rect x="880" y="478" width="240" height="30" rx="15" fill="none" stroke="#8B1A1A" stroke-width="1"/><text x="1000" y="497" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8B1A1A" text-anchor="middle" font-weight="400" letter-spacing="1">SCORED VS GOLDEN SET</text><line x1="80" y1="528" x2="1120" y2="528" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="80" y="575" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#8B1A1A" text-anchor="start" font-weight="500">05</text><text x="130" y="573" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Cost + latency</text><text x="420" y="572" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Tokens and seconds per job, per preset?</text><rect x="880" y="550" width="240" height="30" rx="15" fill="#1a1916" stroke="none" stroke-width="1"/><text x="1000" y="569" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#f5f0e8" text-anchor="middle" font-weight="400" letter-spacing="1">TELEMETRY</text><line x1="80" y1="600" x2="1120" y2="600" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="80" y="640" font-family="'Literata', Georgia, serif" font-size="17" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">The golden set is what makes rows 02 to 04 measurable at all.</text><line x1="80" y1="674" x2="1120" y2="674" stroke="rgba(26,25,22,0.08)" stroke-width="1"/><text x="80" y="702" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2.5">ARTHA CRAFT · CRAFT NOTES</text><text x="1120" y="702" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2.5">ARTHACRAFT.TECH</text></svg>