<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="A model change is a dependency upgrade."><defs><marker id="cn02-change-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1916"/></marker><marker id="cn02-change-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1A1A"/></marker><marker id="cn02-change-ah-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><rect x="80" y="46" width="40" height="2" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="80" y="80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#b83020" text-anchor="start" font-weight="500" letter-spacing="3">CRAFT NOTES · 02 · CHANGING MODELS</text><text x="80" y="130" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#1a1916" text-anchor="start" font-weight="400">A model change is a dependency upgrade.</text><text x="80" y="166" font-family="'Literata', Georgia, serif" font-size="18" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">Gate it like one: baseline, golden set, shadow run, then a one-line switch.</text><text x="375" y="255" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8B1A1A" text-anchor="middle" font-weight="400" letter-spacing="1">NEW RELEASE · DEPRECATION DATE · PRICE CHANGE</text><path d="M375,266 L375,296" fill="none" stroke="#8B1A1A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-red)"/><rect x="80" y="300" width="170" height="120" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="96" y="326" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">01</text><text x="96" y="362" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Baseline</text><text x="96" y="390" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">current preset +</text><text x="96" y="407" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">golden-set scores</text><rect x="290" y="300" width="170" height="120" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="306" y="326" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">02</text><text x="306" y="362" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Candidate</text><text x="306" y="390" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">same golden set,</text><text x="306" y="407" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">same prompt</text><rect x="604" y="300" width="170" height="120" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="620" y="326" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">03</text><text x="620" y="362" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Shadow run</text><text x="620" y="390" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">live inputs,</text><text x="620" y="407" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">output not served</text><rect x="918" y="300" width="170" height="120" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="934" y="326" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">04</text><text x="934" y="362" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#1a1916" text-anchor="start" font-weight="400">Switch</text><text x="934" y="390" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">one config line,</text><text x="934" y="407" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#4a4944" text-anchor="start" font-weight="400">version pinned</text><polygon points="532,318 574,360 532,402 490,360" fill="#faf7f2" stroke="#8B1A1A" stroke-width="1.4"/><text x="532" y="364" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8B1A1A" text-anchor="middle" font-weight="400">regress?</text><path d="M532,402 L532,452" fill="none" stroke="#8B1A1A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-red)"/><text x="532" y="472" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8B1A1A" text-anchor="middle" font-weight="400">yes → stay on baseline</text><polygon points="846,318 888,360 846,402 804,360" fill="#faf7f2" stroke="#8B1A1A" stroke-width="1.4"/><text x="846" y="364" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8B1A1A" text-anchor="middle" font-weight="400">regress?</text><path d="M846,402 L846,452" fill="none" stroke="#8B1A1A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-red)"/><text x="846" y="472" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8B1A1A" text-anchor="middle" font-weight="400">yes → stay on baseline</text><path d="M250,360 L286,360" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-ink)"/><path d="M460,360 L486,360" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-ink)"/><path d="M574,360 L600,360" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-ink)"/><text x="587.0" y="350" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#8a8880" text-anchor="middle" font-weight="400">no</text><path d="M774,360 L800,360" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-ink)"/><path d="M888,360 L914,360" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn02-change-ah-ink)"/><text x="901.0" y="350" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#8a8880" text-anchor="middle" font-weight="400">no</text><path d="M1003,420 L1003,540 L165,540 L165,424" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#cn02-change-ah-ink)"/><rect x="468" y="528" width="240" height="24" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><text x="588" y="545" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1916" text-anchor="middle" font-weight="400">rollback = revert one config line</text><text x="80" y="616" font-family="'Literata', Georgia, serif" font-size="17" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">Never change the model and the prompt in the same release.</text><line x1="80" y1="664" x2="1120" y2="664" stroke="rgba(26,25,22,0.08)" stroke-width="1"/><text x="80" y="692" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2.5">ARTHA CRAFT · CRAFT NOTES</text><text x="1120" y="692" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2.5">ARTHACRAFT.TECH</text></svg>