<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Cap volume, not features."><defs><marker id="cn03-cost-control-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1916"/></marker><marker id="cn03-cost-control-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1A1A"/></marker><marker id="cn03-cost-control-ah-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0" y="0" width="1200" height="660" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><rect x="80" y="46" width="40" height="2" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="80" y="80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#b83020" text-anchor="start" font-weight="500" letter-spacing="3">CRAFT NOTES · 03 · COST CONTROL</text><text x="80" y="130" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#1a1916" text-anchor="start" font-weight="400">Cap volume, not features.</text><text x="80" y="166" font-family="'Literata', Georgia, serif" font-size="18" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">Feature gating trims what customers value. Volume caps trim what costs money.</text><line x1="80" y1="377" x2="1120" y2="377" stroke="rgba(26,25,22,0.08)" stroke-width="1"/><text x="80" y="288" font-family="'DM Serif Display', Georgia, serif" font-size="23" fill="#1a1916" text-anchor="start" font-weight="400">Feature gating</text><text x="80" y="310" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400">what most teams try</text><rect x="360" y="244" width="225" height="96" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="380" y="286" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Remove features from</text><text x="380" y="309" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">lower tiers</text><path d="M589,292 L621,292" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn03-cost-control-ah-ink)"/><rect x="625" y="244" width="225" height="96" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="645" y="286" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Remaining features still</text><text x="645" y="309" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">call the model freely</text><path d="M854,292 L886,292" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn03-cost-control-ah-ink)"/><rect x="890" y="244" width="225" height="96" rx="4" fill="#faf7f2" stroke="#8B1A1A" stroke-width="1.5"/><text x="910" y="286" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#8B1A1A" text-anchor="start" font-weight="400">Spend uncapped.</text><text x="910" y="312" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#8B1A1A" text-anchor="start" font-weight="400">Value stripped.</text><text x="80" y="458" font-family="'DM Serif Display', Georgia, serif" font-size="23" fill="#1a1916" text-anchor="start" font-weight="400">Volume capping</text><text x="80" y="480" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400">what actually works</text><rect x="360" y="414" width="225" height="96" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="380" y="456" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Quota tokens and jobs</text><text x="380" y="479" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">per environment tier</text><path d="M589,462 L621,462" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn03-cost-control-ah-ink)"/><rect x="625" y="414" width="225" height="96" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="645" y="456" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">Usage stops at the</text><text x="645" y="479" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">volume you priced</text><path d="M854,462 L886,462" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn03-cost-control-ah-ink)"/><rect x="890" y="414" width="225" height="96" rx="4" fill="#1a1916" stroke="none" stroke-width="1"/><text x="910" y="456" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#f5f0e8" text-anchor="start" font-weight="400">Spend bounded.</text><text x="910" y="482" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#f5f0e8" text-anchor="start" font-weight="400">Full lifecycle kept.</text><text x="80" y="572" font-family="'Literata', Georgia, serif" font-size="17" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">The lifecycle is why customers pay. Don&#x27;t cut it to save tokens.</text><line x1="80" y1="604" x2="1120" y2="604" stroke="rgba(26,25,22,0.08)" stroke-width="1"/><text x="80" y="632" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2.5">ARTHA CRAFT · CRAFT NOTES</text><text x="1120" y="632" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2.5">ARTHACRAFT.TECH</text></svg>