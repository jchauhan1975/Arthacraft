<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Change one thing at a time."><defs><marker id="cn02-onevar-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1916"/></marker><marker id="cn02-onevar-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1A1A"/></marker><marker id="cn02-onevar-ah-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><rect x="80" y="46" width="40" height="2" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="80" y="80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#b83020" text-anchor="start" font-weight="500" letter-spacing="3">CRAFT NOTES · 02 · ATTRIBUTION</text><text x="80" y="130" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#1a1916" text-anchor="start" font-weight="400">Change one thing at a time.</text><text x="80" y="166" font-family="'Literata', Georgia, serif" font-size="18" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">If the model and the prompt both change, no score can tell you which one broke it.</text><text x="500.0" y="222" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="middle" font-weight="400" letter-spacing="2">PROMPT UNCHANGED</text><text x="900.0" y="222" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="middle" font-weight="400" letter-spacing="2">PROMPT CHANGED</text><text x="280" y="326.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2">MODEL</text><text x="280" y="344.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2">UNCHANGED</text><text x="280" y="522.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2">MODEL</text><text x="280" y="540.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2">CHANGED</text><rect x="304" y="236" width="392" height="188" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="332" y="304" font-family="'DM Serif Display', Georgia, serif" font-size="27" fill="#1a1916" text-anchor="start" font-weight="400">Baseline</text><text x="332" y="342" font-family="'Literata', Georgia, serif" font-size="16" fill="#4a4944" text-anchor="start" font-weight="400">Your scores today. Every</text><text x="332" y="366" font-family="'Literata', Georgia, serif" font-size="16" fill="#4a4944" text-anchor="start" font-weight="400">change is measured against it.</text><rect x="704" y="236" width="392" height="188" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="732" y="304" font-family="'DM Serif Display', Georgia, serif" font-size="27" fill="#1a1916" text-anchor="start" font-weight="400">Prompt change</text><text x="732" y="342" font-family="'Literata', Georgia, serif" font-size="16" fill="#4a4944" text-anchor="start" font-weight="400">Any score movement</text><text x="732" y="366" font-family="'Literata', Georgia, serif" font-size="16" fill="#4a4944" text-anchor="start" font-weight="400">belongs to the prompt.</text><rect x="304" y="432" width="392" height="188" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="332" y="500" font-family="'DM Serif Display', Georgia, serif" font-size="27" fill="#1a1916" text-anchor="start" font-weight="400">Model change</text><text x="332" y="538" font-family="'Literata', Georgia, serif" font-size="16" fill="#4a4944" text-anchor="start" font-weight="400">Any score movement</text><text x="332" y="562" font-family="'Literata', Georgia, serif" font-size="16" fill="#4a4944" text-anchor="start" font-weight="400">belongs to the model.</text><rect x="704" y="432" width="392" height="188" rx="4" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="732" y="500" font-family="'DM Serif Display', Georgia, serif" font-size="27" fill="#f5f0e8" text-anchor="start" font-weight="400">Both changed</text><text x="732" y="538" font-family="'Literata', Georgia, serif" font-size="16" fill="#f5f0e8" text-anchor="start" font-weight="400">Movement can&#x27;t be attributed.</text><text x="732" y="562" font-family="'Literata', Georgia, serif" font-size="16" fill="#f5f0e8" text-anchor="start" font-weight="400">Don&#x27;t ship it.</text><line x1="80" y1="664" x2="1120" y2="664" stroke="rgba(26,25,22,0.08)" stroke-width="1"/><text x="80" y="692" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2.5">ARTHA CRAFT · CRAFT NOTES</text><text x="1120" y="692" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2.5">ARTHACRAFT.TECH</text></svg>