31" font-family="'DM Serif Display', Georgia, serif" font-size="18.5" fill="#1a1916" text-anchor="start" font-weight="400">sub-processors</text><text x="102" y="396" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">DPAs with model</text><text x="102" y="414" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">providers + zero</text><text x="102" y="432" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">data retention</text><polygon points="286,250 460,250 486,305.0 460,360 286,360 312,305.0" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="326" y="280" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">02</text><text x="326" y="308" font-family="'DM Serif Display', Georgia, serif" font-size="18.5" fill="#1a1916" text-anchor="start" font-weight="400">Authentication</text><text x="326" y="331" font-family="'DM Serif Display', Georgia, serif" font-size="18.5" fill="#1a1916" text-anchor="start" font-weight="400">basics</text><text x="326" y="396" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">MFA · SSO</text><text x="326" y="414" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">session revocation</text><polygon points="492,250 666,250 692,305.0 666,360 492,360 518,305.0" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="532" y="280" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">03</text><text x="532" y="308" font-family="'DM Serif Display', Georgia, serif" font-size="18.5" fill="#1a1916" text-anchor="start" font-weight="400">Tamper-evident</text><text x="532" y="331" font-family="'DM Serif Display', Georgia, serif" font-size="18.5" fill="#1a1916" text-anchor="start" font-weight="400">audit log</text><text x="532" y="396" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">records nobody</text><text x="532" y="414" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">can silently edit</text><polygon points="698,250 872,250 898,305.0 872,360 698,360 724,305.0" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="738" y="280" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="1.5">04</text><text x="738" y="308" font-family="'DM Serif Display', Georgia, serif" font-size="18.5" fill="#1a1916" text-anchor="start" font-weight="400">Threat model</text><text x="738" y="331" font-family="'DM Serif Display', Georgia, serif" font-size="18.5" fill="#1a1916" text-anchor="start" font-weight="400">+ DPIA</text><text x="738" y="396" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">documented threats</text><text x="738" y="414" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">+ data protection</text><text x="738" y="432" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#4a4944" text-anchor="start" font-weight="400">impact assessment</text><polygon points="904,250 1078,250 1104,305.0 1078,360 904,360 930,305.0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="944" y="280" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" f