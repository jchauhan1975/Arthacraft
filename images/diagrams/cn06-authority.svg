<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Approval authority never lives in the IDE."><defs><marker id="cn06-authority-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1916"/></marker><marker id="cn06-authority-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1A1A"/></marker><marker id="cn06-authority-ah-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><rect x="80" y="46" width="40" height="2" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="80" y="80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#b83020" text-anchor="start" font-weight="500" letter-spacing="3">CRAFT NOTES · 06 · CONTROL</text><text x="80" y="130" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#1a1916" text-anchor="start" font-weight="400">Approval authority never lives in the IDE.</text><text x="80" y="166" font-family="'Literata', Georgia, serif" font-size="18" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">The agent writes code. The system of record decides what ships.</text><rect x="80" y="212" width="460" height="360" rx="6" fill="none" stroke="rgba(26,25,22,0.28)" stroke-width="1"/><text x="106" y="244" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#8B1A1A" text-anchor="start" font-weight="500" letter-spacing="2">SYSTEM OF RECORD</text><rect x="106" y="270" width="400" height="46" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="126" y="300" font-family="'DM Serif Display', Georgia, serif" font-size="18" fill="#1a1916" text-anchor="start" font-weight="400">Requirements</text><rect x="106" y="330" width="400" height="46" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="126" y="360" font-family="'DM Serif Display', Georgia, serif" font-size="18" fill="#1a1916" text-anchor="start" font-weight="400">Specs + task files</text><rect x="106" y="390" width="400" height="46" rx="4" fill="#fdfcfa" stroke="#8B1A1A" stroke-width="1.5"/><text x="126" y="420" font-family="'DM Serif Display', Georgia, serif" font-size="18" fill="#8B1A1A" text-anchor="start" font-weight="400">Human approval</text><rect x="106" y="450" width="400" height="46" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="126" y="480" font-family="'DM Serif Display', Georgia, serif" font-size="18" fill="#1a1916" text-anchor="start" font-weight="400">Audit trail</text><text x="486" y="420" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8B1A1A" text-anchor="end" font-weight="400">approve · reject</text><rect x="700" y="212" width="420" height="360" rx="6" fill="none" stroke="rgba(26,25,22,0.28)" stroke-width="1" stroke-dasharray="6 5"/><text x="726" y="244" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#4a4944" text-anchor="start" font-weight="500" letter-spacing="2">CLIENT IDE · EXTENSION</text><rect x="740" y="300" width="340" height="140" rx="4" fill="#0c0b09" stroke="none" stroke-width="1"/><text x="764" y="346" font-family="'DM Serif Display', Georgia, serif" font-size="24" fill="#f5f0e8" text-anchor="start" font-weight="400">Coding agent</text><text x="764" y="376" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8b6b0" text-anchor="start" font-weight="400">runs under client</text><text x="764" y="394" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8b6b0" text-anchor="start" font-weight="400">credentials + repo</text><path d="M506,353 L736,353" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn06-authority-ah-ink)"/><text x="621" y="343" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1a1916" text-anchor="middle" font-weight="400">approved task file</text><path d="M740,413 L510,413" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn06-authority-ah-ink)"/><text x="625" y="435" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1a1916" text-anchor="middle" font-weight="400">code + evidence</text><path d="M870,440 L870,500 L980,500 L980,444" fill="none" stroke="#8B1A1A" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#cn06-authority-ah-red)"/><line x1="913" y1="489" x2="937" y2="511" stroke="#8B1A1A" stroke-width="2.2"/><line x1="937" y1="489" x2="913" y2="511" stroke="#8B1A1A" stroke-width="2.2"/><text x="925" y="538" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8B1A1A" text-anchor="middle" font-weight="400">self-approval: never</text><text x="80" y="626" font-family="'Literata', Georgia, serif" font-size="17" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">Keep the decision in the system that keeps the record.</text><line x1="80" y1="644" x2="1120" y2="644" stroke="rgba(26,25,22,0.08)" stroke-width="1"/><text x="80" y="672" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2.5">ARTHA CRAFT · CRAFT NOTES</text><text x="1120" y="672" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2.5">ARTHACRAFT.TECH</text></svg>