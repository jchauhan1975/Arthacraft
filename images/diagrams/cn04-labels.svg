<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-label="Label every finding before you trust it."><defs><marker id="cn04-labels-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1916"/></marker><marker id="cn04-labels-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B1A1A"/></marker><marker id="cn04-labels-ah-mist" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8880"/></marker></defs><rect x="0" y="0" width="1200" height="920" rx="0" fill="#faf7f2" stroke="none" stroke-width="1"/><rect x="80" y="46" width="40" height="2" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="80" y="80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#b83020" text-anchor="start" font-weight="500" letter-spacing="3">CRAFT NOTES · 04 · VERIFICATION</text><text x="80" y="130" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#1a1916" text-anchor="start" font-weight="400">Label every finding before you trust it.</text><text x="80" y="166" font-family="'Literata', Georgia, serif" font-size="18" fill="#4a4944" text-anchor="start" font-weight="400" font-style="italic">Verified, inferred, assumed or unknown. A negative claim needs proof.</text><rect x="300" y="204" width="160" height="38" rx="19" fill="#0c0b09" stroke="none" stroke-width="1"/><text x="380" y="229" font-family="'DM Serif Display', Georgia, serif" font-size="17" fill="#f5f0e8" text-anchor="middle" font-weight="400">AI finding</text><path d="M380,242 L380,266" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn04-labels-ah-ink)"/><rect x="200" y="270" width="360" height="72" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="222" y="301" font-family="'Literata', Georgia, serif" font-size="15.5" fill="#1a1916" text-anchor="start" font-weight="400">Did you check the evidence yourself</text><text x="222" y="323" font-family="'Literata', Georgia, serif" font-size="15.5" fill="#1a1916" text-anchor="start" font-weight="400">in the code, file or source?</text><path d="M560,306 L696,306" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn04-labels-ah-ink)"/><text x="628" y="297" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8a8880" text-anchor="middle" font-weight="400">yes</text><rect x="700" y="270" width="400" height="72" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><rect x="720" y="291" width="120" height="30" rx="15" fill="#1a1916" stroke="none" stroke-width="1"/><text x="780" y="311" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#f5f0e8" text-anchor="middle" font-weight="500" letter-spacing="1.5">VERIFIED</text><text x="858" y="311" font-family="'Literata', Georgia, serif" font-size="15" fill="#4a4944" text-anchor="start" font-weight="400">Cite exactly where you checked.</text><path d="M380,342 L380,396" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn04-labels-ah-ink)"/><text x="392" y="374" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="400">no</text><rect x="200" y="400" width="360" height="72" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="222" y="431" font-family="'Literata', Georgia, serif" font-size="15.5" fill="#1a1916" text-anchor="start" font-weight="400">Does it follow directly from</text><text x="222" y="453" font-family="'Literata', Georgia, serif" font-size="15.5" fill="#1a1916" text-anchor="start" font-weight="400">evidence you verified?</text><path d="M560,436 L696,436" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn04-labels-ah-ink)"/><text x="628" y="427" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8a8880" text-anchor="middle" font-weight="400">yes</text><rect x="700" y="400" width="400" height="72" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><rect x="720" y="421" width="120" height="30" rx="15" fill="none" stroke="#1a1916" stroke-width="1.3"/><text x="780" y="441" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1916" text-anchor="middle" font-weight="500" letter-spacing="1.5">INFERRED</text><text x="858" y="441" font-family="'Literata', Georgia, serif" font-size="15" fill="#4a4944" text-anchor="start" font-weight="400">Show the reasoning chain.</text><path d="M380,472 L380,526" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn04-labels-ah-ink)"/><text x="392" y="504" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="400">no</text><rect x="200" y="530" width="360" height="72" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><text x="222" y="561" font-family="'Literata', Georgia, serif" font-size="15.5" fill="#1a1916" text-anchor="start" font-weight="400">Is there any stated basis for it,</text><text x="222" y="583" font-family="'Literata', Georgia, serif" font-size="15.5" fill="#1a1916" text-anchor="start" font-weight="400">even unchecked?</text><path d="M560,566 L696,566" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn04-labels-ah-ink)"/><text x="628" y="557" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8a8880" text-anchor="middle" font-weight="400">yes</text><rect x="700" y="530" width="400" height="72" rx="4" fill="#fdfcfa" stroke="rgba(26,25,22,0.18)" stroke-width="1"/><rect x="720" y="551" width="120" height="30" rx="15" fill="none" stroke="#b8912a" stroke-width="1.3" stroke-dasharray="4 3"/><text x="780" y="571" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8912a" text-anchor="middle" font-weight="500" letter-spacing="1.5">ASSUMED</text><text x="858" y="571" font-family="'Literata', Georgia, serif" font-size="15" fill="#4a4944" text-anchor="start" font-weight="400">Flag it. Confirm before acting.</text><path d="M380,602 L380,656" fill="none" stroke="#1a1916" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#cn04-labels-ah-ink)"/><text x="392" y="634" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="400">no</text><rect x="200" y="660" width="360" height="72" rx="4" fill="#fdfcfa" stroke="#8B1A1A" stroke-width="1.3"/><rect x="220" y="681" width="120" height="30" rx="15" fill="none" stroke="#8B1A1A" stroke-width="1.3"/><text x="280" y="701" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8B1A1A" text-anchor="middle" font-weight="500" letter-spacing="1.5">UNKNOWN</text><text x="356" y="701" font-family="'Literata', Georgia, serif" font-size="15" fill="#4a4944" text-anchor="start" font-weight="400">Say so. Don&#x27;t fill the gap.</text><rect x="80" y="774" width="1040" height="72" rx="3" fill="rgba(139,26,26,0.06)" stroke="none" stroke-width="1"/><rect x="80" y="774" width="3" height="72" rx="0" fill="#8B1A1A" stroke="none" stroke-width="1"/><text x="104" y="800" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8B1A1A" text-anchor="start" font-weight="500" letter-spacing="2">RULE FOR NEGATIVE CLAIMS</text><text x="104" y="828" font-family="'Literata', Georgia, serif" font-size="16" fill="#1a1916" text-anchor="start" font-weight="400">“X is missing” can&#x27;t be VERIFIED without a cited search showing it isn&#x27;t there.</text><line x1="80" y1="864" x2="1120" y2="864" stroke="rgba(26,25,22,0.08)" stroke-width="1"/><text x="80" y="892" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="start" font-weight="400" letter-spacing="2.5">ARTHA CRAFT · CRAFT NOTES</text><text x="1120" y="892" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#8a8880" text-anchor="end" font-weight="400" letter-spacing="2.5">ARTHACRAFT.TECH</text></svg>